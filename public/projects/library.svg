  <rect x="50" y="95" width="150" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
  <text x="80" y="115" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📖 Books Catalog</text>

