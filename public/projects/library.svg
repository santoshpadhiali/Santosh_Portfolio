  <text x="250" y="414" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-transform="uppercase">Backend Architecture &amp; Database</text>
  <text x="250" y="433" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11.5">
