  <rect x="235" y="277" width="510" height="42" rx="6" fill="#0f192e" stroke="#1e293b" />
  <text x="250" y="302" fill="#38bdf8" font-family="monospace" font-size="11">978-0132350884</text>
  <text x="360" y="302" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Clean Code &amp; Architecture</text>
  <text x="520" y="302" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Robert C. Martin</text>
  <rect x="650" y="288" width="80" height="20" rx="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="690" y="302" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Issued</text>

  <rect x="235" y="327" width="510" height="42" rx="6" fill="#0d1629" stroke="#1e293b" />
  <text x="250" y="352" fill="#38bdf8" font-family="monospace" font-size="11">978-1491950357</text>
  <text x="360" y="352" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Spring Boot: Up &amp; Running</text>
  <text x="520" y="352" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Mark Heckler</text>
  <rect x="650" y="338" width="80" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
  <text x="690" y="352" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Available</text>

