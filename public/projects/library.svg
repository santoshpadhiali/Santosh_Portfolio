  <text x="360" y="252" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Effective Java (3rd Edition)</text>
  <text x="520" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Joshua Bloch</text>
  <rect x="650" y="238" width="80" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
