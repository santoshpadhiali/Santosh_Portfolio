<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#chatBg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window Container -->
  <rect x="35" y="30" width="730" height="440" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="35" y="30" width="730" height="44" rx="14" fill="#131c31" />
  <rect x="35" y="60" width="730" height="14" fill="#131c31" />
  <circle cx="60" cy="52" r="5.5" fill="#ef4444" />
  <circle cx="78" cy="52" r="5.5" fill="#eab308" />
  <circle cx="96" cy="52" r="5.5" fill="#22c55e" />

  <text x="400" y="57" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    💬 Chat Next • Real-Time WebSocket (STOMP), SockJS &amp; Spring Boot
  </text>

  <!-- Sidebar: Multi-Channel Rooms -->
  <rect x="35" y="74" width="190" height="396" fill="#0d1527" />
  <line x1="225" y1="74" x2="225" y2="470" stroke="#1e293b" stroke-width="1" />

  <text x="50" y="102" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-transform="uppercase">CHANNELS</text>

  <rect x="45" y="115" width="170" height="30" rx="7" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.3" />
  <text x="60" y="135" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700"># tech-discussion</text>

  <rect x="45" y="152" width="170" height="28" rx="7" fill="transparent" />
  <text x="60" y="171" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12"># java-spring-hub</text>

  <rect x="45" y="187" width="170" height="28" rx="7" fill="transparent" />
  <text x="60" y="206" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12"># general-chat</text>

  <text x="50" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-transform="uppercase">ONLINE USERS (4)</text>

  <circle cx="56" cy="268" r="4.5" fill="#22c55e" />
  <text x="68" y="272" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">Monalisa (You)</text>

  <circle cx="56" cy="296" r="4.5" fill="#22c55e" />
  <text x="68" y="300" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Rajesh Kumar</text>

  <circle cx="56" cy="324" r="4.5" fill="#22c55e" />
  <text x="68" y="328" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Ananya Sharma</text>

  <!-- Live Connection Indicator -->
  <rect x="45" y="415" width="170" height="36" rx="8" fill="#022c22" stroke="#059669" stroke-opacity="0.4" />
  <circle cx="60" cy="433" r="4" fill="#34d399" />
  <text x="72" y="437" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="700">STOMP: Connected</text>

  <!-- Chat Area -->
  <!-- Chat Header Bar -->
  <rect x="225" y="74" width="540" height="42" fill="#0f172a" />
  <line x1="225" y1="116" x2="765" y2="116" stroke="#1e293b" stroke-width="1" />
  <text x="245" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700"># tech-discussion</text>
  <text x="375" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Real-time STOMP WebSocket Messaging</text>
  <rect x="660" y="84" width="90" height="24" rx="6" fill="#1e293b" />
  <text x="705" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">📥 Export Logs</text>

  <!-- Message 1 (Incoming) -->
  <circle cx="260" cy="150" r="15" fill="#6366f1" />
  <text x="260" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RK</text>
  <text x="285" y="142" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Rajesh Kumar</text>
  <text x="365" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">10:42 AM</text>
  <rect x="285" y="150" width="310" height="34" rx="10" fill="#1e293b" />
  <text x="298" y="171" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5">
    Hey Monalisa, is WebSocket broadcasting configured?
  </text>

  <!-- Message 2 (Outgoing from Monalisa) -->
  <rect x="420" y="200" width="320" height="48" rx="10" fill="url(#bubbleGrad)" />
  <text x="435" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
    Yes! STOMP protocol over SockJS fallback is live.
  </text>
  <text x="435" y="238" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5">
    Multi-channel rooms, reactions &amp; search are active 🚀
  </text>
  <text x="720" y="260" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">10:43 AM • Delivered</text>

  <!-- Message 3 (System Notice) -->
  <rect x="360" y="275" width="230" height="24" rx="12" fill="#1e293b" fill-opacity="0.6" />
  <text x="475" y="291" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">
    ⚡ User Ananya Sharma joined the room
  </text>

  <!-- Message Input Box -->
  <rect x="245" y="415" width="440" height="42" rx="10" fill="#131c31" stroke="#334155" />
  <text x="265" y="440" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Type a message... (instant broadcast)</text>
  <rect x="695" y="415" width="55" height="42" rx="10" fill="#0284c7" />
  <text x="722" y="441" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">➤</text>
</svg>

