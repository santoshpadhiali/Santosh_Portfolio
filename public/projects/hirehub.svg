  <circle cx="725" cy="58" r="14" fill="#334155" />
  <text x="725" y="63" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SP</text>

  <!-- Search & Filter Banner -->
