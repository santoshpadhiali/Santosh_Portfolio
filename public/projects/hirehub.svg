<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hhBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
    <linearGradient id="hhBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="hhCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#hhBgGrad)" />

  <!-- App Header -->
  <rect x="30" y="30" width="740" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  
  <!-- Logo -->
  <rect x="50" y="44" width="28" height="28" rx="6" fill="url(#hhBrandGrad)" />
  <text x="64" y="63" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">H</text>
  <text x="88" y="63" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">Hire<tspan fill="#38bdf8">HUB</tspan></text>

  <!-- Navigation items -->
  <text x="210" y="62" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Find Jobs</text>
