  <rect x="45" y="252" width="70" height="20" rx="4" fill="#0f172a" />
  <text x="80" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">₹14L - 22L/yr</text>
  <rect x="122" y="252" width="60" height="20" rx="4" fill="#065f46" />
  <text x="152" y="266" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Full-Time</text>
  <rect x="188" y="252" width="65" height="20" rx="4" fill="#312e81" />
  <text x="220" y="266" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">MERN Stack</text>
  
  <rect x="45" y="282" width="325" height="28" rx="6" fill="#0284c7" />
  <text x="207" y="301" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Quick Apply with 1-Click Track 🚀</text>

  <!-- Card 2 -->
  <rect x="415" y="185" width="355" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <rect x="430" y="200" width="40" height="40" rx="8" fill="#10b981" />
  <text x="450" y="226" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Node</text>
  <text x="480" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Backend API Developer</text>
  <text x="480" y="233" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">CloudScale Global • Hybrid</text>
  <rect x="430" y="252" width="70" height="20" rx="4" fill="#0f172a" />
  <text x="465" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">₹12L - 18L/yr</text>
  <rect x="507" y="252" width="60" height="20" rx="4" fill="#065f46" />
  <text x="537" y="266" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Full-Time</text>
  <rect x="573" y="252" width="75" height="20" rx="4" fill="#831843" />
  <text x="610" y="266" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Node + Mongo</text>
  
  <rect x="430" y="282" width="325" height="28" rx="6" fill="#334155" />
  <text x="592" y="301" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Applied • Status: Shortlisted ✓</text>

  <!-- Application Tracking Pipeline -->
  <rect x="30" y="335" width="740" height="135" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2" />
  <text x="50" y="360" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Live Application Tracking Board</text>
  <text x="690" y="360" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">JWT Authenticated</text>

  <rect x="50" y="375" width="160" height="80" rx="6" fill="#1e293b" />
  <text x="65" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Applied (8)</text>
  <rect x="65" y="405" width="130" height="40" rx="4" fill="#0f172a" />
  <text x="75" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Frontend Intern</text>
  <text x="75" y="437" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">2 hours ago</text>

  <rect x="230" y="375" width="160" height="80" rx="6" fill="#1e293b" />
  <text x="245" y="395" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">In Review (4)</text>
  <rect x="245" y="405" width="130" height="40" rx="4" fill="#0f172a" />
  <text x="255" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Full Stack MERN</text>
  <text x="255" y="437" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Review by Lead</text>

  <rect x="410" y="375" width="160" height="80" rx="6" fill="#1e293b" />
  <text x="425" y="395" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11">Interview (2)</text>
  <rect x="425" y="405" width="130" height="40" rx="4" fill="#0f172a" />
  <text x="435" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">React Specialist</text>
  <text x="435" y="437" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">Tomorrow, 3 PM</text>

  <rect x="590" y="375" width="160" height="80" rx="6" fill="#1e293b" />
  <text x="605" y="395" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Offers (1)</text>
  <rect x="605" y="405" width="130" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="615" y="423" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Software Dev</text>
  <text x="615" y="437" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">🎉 Offer Extended</text>
</svg>

