  <text x="65" y="226" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">⚛</text>
  <text x="95" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Senior React Engineer</text>
