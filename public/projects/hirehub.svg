  <text x="375" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Applications (14)</text>
  <text x="490" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Analytics</text>

  <!-- Role Badge -->
