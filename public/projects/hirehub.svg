  <rect x="50" y="115" width="250" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="75" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🔍 Search Title: e.g. "React Developer"</text>

  <rect x="315" y="115" width="180" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="335" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">📍 Location: Remote</text>

  <rect x="510" y="115" width="130" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="525" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">💼 Full-time ▾</text>

  <rect x="655" y="115" width="95" height="40" rx="8" fill="url(#hhBrandGrad)" />
