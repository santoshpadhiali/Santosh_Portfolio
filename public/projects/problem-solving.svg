<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#2a1215" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#psBg)" />

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window Container -->
  <rect x="35" y="30" width="730" height="440" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="35" y="30" width="730" height="44" rx="14" fill="#131c31" />
  <rect x="35" y="60" width="730" height="14" fill="#131c31" />
  <circle cx="60" cy="52" r="5.5" fill="#ef4444" />
  <circle cx="78" cy="52" r="5.5" fill="#eab308" />
  <circle cx="96" cy="52" r="5.5" fill="#22c55e" />

  <text x="400" y="57" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
