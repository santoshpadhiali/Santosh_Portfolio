  </text>

  <!-- LeetCode Card -->
  <rect x="65" y="100" width="315" height="260" rx="12" fill="#131d33" stroke="#f59e0b" stroke-opacity="0.3" />
  <circle cx="105" cy="140" r="20" fill="#f59e0b" fill-opacity="0.15" />
  <text x="105" y="146" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LC</text>
  <text x="140" y="137" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">LeetCode Profile</text>
  <text x="140" y="154" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Data Structures &amp; Algorithms</text>

  <rect x="85" y="180" width="275" height="50" rx="8" fill="#0b1120" />
  <text x="100" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Solved Problems</text>
  <text x="100" y="222" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="800">150+ Problems</text>

  <text x="85" y="260" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Arrays, Strings, Two Pointers</text>
  <text x="85" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Linked Lists, Trees, Recursion</text>
  <text x="85" y="310" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Binary Search, Stacks, Queues</text>
  <text x="85" y="335" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Strong Algorithmic Thinking</text>

  <!-- Oracle SQL Card -->
  <rect x="420" y="100" width="315" height="260" rx="12" fill="#131d33" stroke="#ef4444" stroke-opacity="0.3" />
  <circle cx="460" cy="140" r="20" fill="#ef4444" fill-opacity="0.15" />
  <text x="460" y="146" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SQL</text>
  <text x="495" y="137" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Oracle SQL Queries</text>
  <text x="495" y="154" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Relational Database Querying</text>

  <rect x="440" y="180" width="275" height="50" rx="8" fill="#0b1120" />
  <text x="455" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Queries Mastered</text>
  <text x="455" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">400+ Queries</text>

  <text x="440" y="260" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Complex Joins, Subqueries, CTEs</text>
  <text x="440" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Window Functions &amp; Aggregates</text>
  <text x="440" y="310" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Schema Design, DDL, DML, TCL</text>
  <text x="440" y="335" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Database Optimization &amp; Indexing</text>

  <!-- Bottom Strip -->
  <rect x="65" y="380" width="670" height="60" rx="10" fill="#0a1222" stroke="#1e293b" />
  <text x="85" y="405" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-transform="uppercase">Core CS &amp; Problem Solving Competencies</text>
  <text x="85" y="426" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">
    Data Structures &amp; Algorithms (DSA) • Object Oriented Programming (OOP) • DBMS • Regular Expressions
  </text>
