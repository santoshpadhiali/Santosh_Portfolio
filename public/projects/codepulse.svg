  <text x="400" y="51" fill="#cdd6f4" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CodePulse • Live Room #algo-session-09</text>
  
  <rect x="635" y="36" width="125" height="22" rx="11" fill="#313244" />
