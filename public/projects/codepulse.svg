  <rect x="550" y="342" width="215" height="120" rx="8" fill="#181825" />
  
  <text x="558" y="360" fill="#cba6f7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Santosh:</text>
  <text x="558" y="374" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Testing Python &amp; C++ sandboxing!</text>
  
  <text x="558" y="396" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Peer Dev:</text>
  <text x="558" y="410" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">Execution took 21ms! Fast! ⚡</text>

  <rect x="558" y="430" width="199" height="24" rx="4" fill="#11111b" stroke="#45475a" stroke-width="1" />
  <text x="568" y="446" fill="#6c7086" font-family="system-ui, sans-serif" font-size="10">Send instant chat...</text>

