  </g>

  <!-- Code Syntax -->
  <g font-family="monospace" font-size="12">
    <!-- Line 1 -->
    <text x="68" y="125"><tspan fill="#cba6f7">import</tspan> <tspan fill="#f9e2af">{ StreamVideoClient }</tspan> <tspan fill="#cba6f7">from</tspan> <tspan fill="#a6e3a1">'@getstream/sdk'</tspan>;</text>
    <!-- Line 2 -->
    <text x="68" y="145"><tspan fill="#cba6f7">function</tspan> <tspan fill="#89b4fa">collaborativeRunner</tspan><tspan fill="#cdd6f4">(inputCode, language)</tspan> <tspan fill="#cdd6f4">{</tspan></text>
    <!-- Line 3 -->
    <text x="88" y="165"><tspan fill="#6c7086">// Multi-language isolated sandboxing</tspan></text>
    <!-- Line 4 -->
    <text x="88" y="185"><tspan fill="#cba6f7">const</tspan> <tspan fill="#f9e2af">sandboxResult</tspan> = <tspan fill="#cba6f7">await</tspan> <tspan fill="#89b4fa">executeInContainer</tspan><tspan fill="#cdd6f4">({</tspan></text>
    <!-- Line 5 -->
    <text x="108" y="205"><tspan fill="#f38ba8">lang</tspan><tspan fill="#cdd6f4">: language,</tspan> <tspan fill="#f38ba8">code</tspan><tspan fill="#cdd6f4">: inputCode,</tspan> <tspan fill="#f38ba8">timeoutMs</tspan><tspan fill="#cdd6f4">: 3000</tspan></text>
    <!-- Line 6 -->
    <text x="88" y="225"><tspan fill="#cdd6f4">});</tspan></text>
    <!-- Line 7 -->
    <text x="88" y="245"><tspan fill="#cba6f7">return</tspan> <tspan fill="#cdd6f4">{</tspan> <tspan fill="#f38ba8">output</tspan><tspan fill="#cdd6f4">: sandboxResult.logs,</tspan> <tspan fill="#f38ba8">status</tspan><tspan fill="#cdd6f4">:</tspan> <tspan fill="#a6e3a1">'SUCCESS'</tspan> <tspan fill="#cdd6f4">};</tspan></text>
    <!-- Line 8 -->
    <text x="68" y="265"><tspan fill="#cdd6f4">}</tspan></text>
  </g>

