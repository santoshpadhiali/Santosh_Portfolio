  <rect x="550" y="225" width="215" height="85" rx="8" fill="#1e1e2e" />
  <circle cx="657" cy="260" r="22" fill="#45475a" />
  <text x="657" y="266" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">💻</text>
