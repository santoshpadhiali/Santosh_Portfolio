  <text x="85" y="90" fill="#89b4fa" font-family="system-ui, monospace" font-size="11" font-weight="bold" text-anchor="middle">JS solution.js</text>

  <rect x="140" y="71" width="90" height="30" rx="6" fill="transparent" />
  <text x="185" y="90" fill="#6c7086" font-family="system-ui, monospace" font-size="11" text-anchor="middle">Python main.py</text>

  <rect x="235" y="71" width="85" height="30" rx="6" fill="transparent" />
  <text x="277" y="90" fill="#6c7086" font-family="system-ui, monospace" font-size="11" text-anchor="middle">Java App.java</text>

  <rect x="325" y="71" width="75" height="30" rx="6" fill="transparent" />
  <text x="362" y="90" fill="#6c7086" font-family="system-ui, monospace" font-size="11" text-anchor="middle">C++ solver.cpp</text>

